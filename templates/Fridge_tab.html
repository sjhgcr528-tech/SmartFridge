<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Fridge</title>
  <!-- FontAwesome 아이콘 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 모바일 프레임 */
    .app-container {
      width: 375px;
      height: 812px;
      background-color: #cce7d0; /* 상단 연연두색 배경 */
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border: 8px solid #333;
    }

    /* 상단 상태바 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px 4px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-bar .icons i {
      margin-left: 4px;
    }

    /* 헤더 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px 16px;
    }

    .header .back-btn, .header .add-btn {
      font-size: 20px;
      cursor: pointer;
      color: #333;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1c1c1e;
    }

    /* 주방 배경 & 컨텐츠 영역 */
    .kitchen-view {
      flex: 1;
      background-color: #e5e5e0; /* 배경 벽면 색상 */
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      overflow: hidden;
    }

    /* 상단 찬장/수납장 */
    .top-cabinet {
      width: 250px;
      height: 100px;
      background-color: #d8dad3;
      border: 2px solid #b0b3a8;
      box-shadow: inset 0 -3px 5px rgba(0,0,0,0.05);
      position: relative;
      margin-bottom: 2px;
    }

    .cabinet-door {
      width: 100%;
      height: 100%;
      border: 6px solid #d8dad3;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.15);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 6px;
    }

    .cabinet-handle {
      width: 45px;
      height: 5px;
      background-color: #777;
      border-radius: 2px;
    }

    /* 냉장고 전체 */
    .refrigerator {
      width: 256px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 2;
    }

    /* 공통 냉장고 도어 메탈 질감 */
    .fridge-door {
      background: linear-gradient(135deg, #e6e8eb 0%, #b8bcbe 50%, #d5d8db 100%);
      border: 1px solid #9fa3a6;
      position: relative;
      box-shadow: 2px 4px 10px rgba(0,0,0,0.15);
    }

    /* 냉동실 (상단) */
    .freezer {
      height: 210px;
      border-radius: 4px 4px 0 0;
    }

    /* 냉장실 (하단) */
    .fridge-main {
      height: 310px;
      border-radius: 0 0 4px 4px;
    }

    /* 손잡이 */
    .handle-left {
      position: absolute;
      left: 8px;
      top: 75px;
      width: 10px;
      height: 120px;
      background: linear-gradient(to right, #888, #ccc, #666);
      border-radius: 3px;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.2);
    }

    .fridge-main .handle-left {
      top: 10px;
      height: 140px;
    }

    /* 포스트잇 (메모지) 스타일 */
    .sticky-note {
      position: absolute;
      width: 54px;
      height: 54px;
      padding: 6px;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.2);
      font-size: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 2px;
    }

    /* 고정 자석 핀 */
    .sticky-note::before {
      content: "";
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background-color: #a3a3a3;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .note-1 {
      background-color: #ffd8a8; /* 주황색 메모지 */
      top: 45px;
      left: 42px;
      transform: rotate(-3deg);
    }

    .note-2 {
      background-color: #ffec99; /* 노란색 메모지 */
      top: 25px;
      right: 32px;
      transform: rotate(2deg);
    }

    .note-3 {
      background-color: #fcc2d7; /* 핑크색 메모지 */
      top: 105px;
      left: 105px;
      transform: rotate(-1deg);
    }

    /* 양옆 하단 주방 가구 배경 */
    .kitchen-counter-left, .kitchen-counter-right {
      position: absolute;
      bottom: 0;
      width: 60px;
      height: 190px;
      background-color: #d0d3c5;
      border: 1px solid #a8ab9e;
    }

    .kitchen-counter-left {
      left: 0;
      border-right: none;
    }

    .kitchen-counter-right {
      right: 0;
      border-left: none;
    }

    /* 손잡이 디테일 */
    .counter-handle {
      width: 70px;
      height: 6px;
      background-color: #a69578;
      position: absolute;
      top: -1px;
    }

    .kitchen-counter-right .counter-handle {
      right: auto;
    }

    /* 하단 바닥 레이어 */
    .floor-line {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 12px;
      background-color: #b58a63;
      border-top: 2px solid #8d623a;
    }

    /* 하단 네비게이션 바 */
    .navbar {
      height: 65px;
      background-color: #ffffff;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #eee;
      z-index: 10;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #8e8e93;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-item.active {
      color: #2e7d32;
      font-weight: bold;
    }

    .nav-item i {
      font-size: 18px;
    }

    .home-indicator {
      width: 134px;
      height: 5px;
      background-color: #000;
      border-radius: 3px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 상태바 -->
    <div class="status-bar">
      <span id ='clock'>00:00</span>
      <div class="icons">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <!-- 헤더 -->
    <div class="header">
      <div class="back-btn"><a href="https://www.coupang.com/"><i class="fa-solid fa-cart-shopping" ></i></a></div>
      <h1>냉장고</h1>
      <div class="add-btn"><i class="fa-solid fa-plus"></i></div>
    </div>

    <!-- 주방 및 냉장고 뷰 -->
    <div class="kitchen-view">
      <!-- 상단 수납장 -->
      <div class="top-cabinet">
        <div class="cabinet-door">
          <a href="InCabinet.html">
            <div class="cabinet-handle"></div>
          </a>
        </div>
      </div>

      <!-- 냉장고 본체 -->
      <div class="refrigerator">
        <!-- 상단 냉동실 (메모지 붙은 칸) -->
        <div class="fridge-door freezer">
          <a href="InFreezer.html">
            <div class="handle-left"></div>
          </a>
          <!-- 메모지 3개 -->
          <div class="sticky-note note-2"></div>
          <div class="sticky-note note-3"></div>
        </div>

        <!-- 하단 냉장실 -->
        <div class="fridge-door fridge-main">
          <a href="InFirdge.html">
            <div class="handle-left"></div>
          </a>
        </div>
      </div>

      <!-- 양옆 주방 하부장 배경 -->
      <div class="kitchen-counter-left">
        <div class="counter-handle"></div>
      </div>
      <div class="kitchen-counter-right">
        <div class="counter-handle"></div>
      </div>

      <!-- 바닥선 -->
      <div class="floor-line"></div>
    </div>

    <!-- 하단 탭 바 (Fridge 탭 활성화) -->
    <div class="navbar">
      <a class="nav-item" href="summary">
        <i class="fa-solid fa-chart-pie"></i>
        <span>통계</span>
      </a>
      <a class="nav-item active" href="/">
        <i class="fa-solid fa-snowflake"></i>
        <span>냉장고</span>
      </a>
      <a class="nav-item" href="recipes">
        <i class="fa-solid fa-book-open"></i>
        <span>레시피</span>
      </a>
    </div>

    <div class="home-indicator"></div>
  </div>

  <!-- 상품 입력 모달창 -->
<div id="addModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
  <div style="background:white; padding:24px; border-radius:16px; width:300px; display:flex; flex-direction:column; gap:12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
    <h3 style="font-size:18px; font-weight:700; color:#1c1c1e;">새 식품 추가</h3>
    <input type="text" id="modalItemName" placeholder="상품 이름 (예: 우유, 김치)" style="padding:10px; border:1px solid #ddd; border-radius:8px; font-size:14px;">
    <select id="modalItemStorage" style="padding:10px; border:1px solid #ddd; border-radius:8px; font-size:14px; background:white;">
      <option value="냉장">냉장 (InFridge)</option>
      <option value="냉동">냉동 (InFreezer)</option>
      <option value="상온">상온 (InCabinet)</option>
    </select>
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
      <button id="modalCloseBtn" style="padding:8px 14px; background:#e0e0e0; border:none; border-radius:6px; cursor:pointer; font-weight:600;">취소</button>
      <button id="modalSubmitBtn" style="padding:8px 14px; background:#20e070; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">등록</button>
    </div>
  </div>
</div>

</body>
<script>
  function updateClock() {
    const now = new Date();
    
    // 시, 분, 초를 가져오고 두 자릿수로 맞춤 (예: 9시 -> 09시)
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');

    document.getElementById('clock').textContent = `${hours}:${minutes}`;
  }

  // 페이지가 로드될 때 바로 한 번 실행
  updateClock();

  // 1초(1000ms)마다 updateClock 함수 반복 실행
  setInterval(updateClock, 1000);

  // --- [여기에 AI 연동 자바스크립트 추가] ---
  document.querySelectorAll('.add-btn, .fab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('addModal').style.display = 'flex';
    });
  });

  document.getElementById('modalCloseBtn').addEventListener('click', () => {
    document.getElementById('addModal').style.display = 'none';
  });

  document.getElementById('modalSubmitBtn').addEventListener('click', () => {
    const name = document.getElementById('modalItemName').value;
    const storage = document.getElementById('modalItemStorage').value;

    if (!name.trim()) {
      alert('상품 이름을 입력해주세요.');
      return;
    }

    fetch('/api/add-ingredient', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, storage: storage })
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        alert(data.message);
        document.getElementById('addModal').style.display = 'none';
        document.getElementById('modalItemName').value = '';
        
        if (data.category === 'InFridge') location.href = 'InFirdge.html';
        else if (data.category === 'InFreezer') location.href = 'InFreezer.html';
        else if (data.category === 'InCabinet') location.href = 'InCabinet.html';
      }
    });
  });
</script>
</html>
